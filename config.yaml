---
name: Barcode Buddy for Grocy
version: 1.2.1
slug: bbuddy-grocy
description: Barcode scanning for Grocy with Open Food Facts lookup and best-before prompts
url: https://github.com/n15c/barcodebuddy-homeassistant
# Fertige Images aus der GitHub Container Registry (siehe .github/workflows/publish.yaml)
image: ghcr.io/n15c/{arch}-addon-bbuddy-grocy
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:barcode-scan
panel_title: Barcode Buddy
panel_admin: true
startup: application
arch:
- aarch64
- amd64
- armv7
- i386
boot: auto
init: false
udev: true
map:
# Eigener Konfigurationsordner des Add-ons (/config im Container)
- addon_config:rw
ports:
  80/tcp: 8621
ports_description:
  80/tcp: Web interface (direct access, e.g. for the API and scanner apps)
options:
  disable_auth: false
  debug: false
  curl_allow_insecure_ssl_ca: false
  curl_allow_insecure_ssl_host: false
  ATTACH_BARCODESCANNER: false
  SCANNER_DEVICE: ""
  SCANNER_DEBUG: false
  auto_create_products: true
  auto_create_location: ""
  auto_create_quantity_unit: ""
  product_language: de
schema:
  disable_auth: bool
  debug: bool
  curl_allow_insecure_ssl_ca: bool
  curl_allow_insecure_ssl_host: bool
  ATTACH_BARCODESCANNER: bool
  SCANNER_DEVICE: "device(subsystem=input)?"
  SCANNER_DEBUG: "bool?"
  auto_create_products: bool
  auto_create_location: "str?"
  auto_create_quantity_unit: "str?"
  product_language: "match(^[a-z]{2}$)"
