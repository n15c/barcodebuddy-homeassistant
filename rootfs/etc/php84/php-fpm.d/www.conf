[www]
user = barcodebuddy
group = barcodebuddy
listen = 127.0.0.1:9000
; Genug Prozesse, damit die Live-Anzeige (Server-Sent Events) andere Anfragen nicht blockiert
pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
catch_workers_output = yes
decorate_workers_output = no
