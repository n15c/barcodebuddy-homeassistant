# Direkter Zugriff ueber den Add-on-Port (Standard 8621), z.B. fuer API und Scanner-Apps.
# Hier gilt die Anmeldung von Barcode Buddy (bzw. die Option disable_auth).
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/includes/bbuddy_locations.conf;

    location ~ \.php$ {
        include /etc/nginx/includes/bbuddy_php.conf;
    }
}
