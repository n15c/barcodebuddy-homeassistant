# Home Assistant Ingress
# Der Supervisor leitet /api/hassio_ingress/<token>/ auf diesen Port weiter (Praefix entfernt) und
# uebergibt den Praefix im Header X-Ingress-Path. Nur der Supervisor (172.30.32.2) darf zugreifen;
# die Anmeldung uebernimmt Home Assistant.
server {
    listen 8099 default_server;
    server_name _;

    allow 172.30.32.2;
    deny all;

    include /etc/nginx/includes/bbuddy_locations.conf;

    location ~ \.php$ {
        include /etc/nginx/includes/bbuddy_php.conf;
        # Formular-Ziele und Redirects (BASEURL + PHP_SELF) bleiben im Ingress-Pfad
        fastcgi_param BBUDDY_BASEURL $http_x_ingress_path;
        # Home Assistant hat den Benutzer bereits angemeldet
        fastcgi_param BBUDDY_DISABLE_AUTHENTICATION 'true';
    }
}
