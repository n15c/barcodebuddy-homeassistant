# Gemeinsame Regeln beider Server (Pfade wie im Original-Docker-Image von Barcode Buddy)
root /app/bbuddy/;
index index.php index.html;
absolute_redirect off;

location / {
    try_files $uri $uri/ =404;
}

location /api/ {
    try_files $uri /api/index.php$is_args$query_string;
}

# Interne Dateien nie ausliefern
location ~ /(data|example|plugins)/ {
    deny all;
}
location ~ /\. {
    deny all;
}
