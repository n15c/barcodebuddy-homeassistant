# Home Assistant Ingress
# Der Supervisor leitet die Anfragen von /api/hassio_ingress/<token>/ auf diesen
# Port weiter (Praefix entfernt) und uebergibt den Praefix im Header X-Ingress-Path.
# Nur der Supervisor (172.30.32.2) darf zugreifen; die Anmeldung uebernimmt Home Assistant.
server {
  listen 8099 default_server;
  root /app/bbuddy/;
  index index.php index.html index.htm;
  server_name _;

  allow 172.30.32.2;
  deny all;

  client_max_body_size 100M;
  client_body_buffer_size 128k;
  absolute_redirect off;

  location / {
        try_files $uri $uri/ =404;
  }

  location /api/ {
        try_files $uri /api/index.php$is_args$query_string;
  }

  location ~ /example/ {
       deny all;
  }

  location ~ /data/ {
       deny all;
  }

  location ~ \.php$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_read_timeout 80;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_pass_header "X-Accel-Buffering";
    # Server-Sent-Events (Live-Anzeige) nicht puffern
    fastcgi_buffering off;
    include /etc/nginx/fastcgi_params;
    # BarcodeBuddy erzeugt Formular-Ziele und Redirects mit BASEURL + PHP_SELF.
    # Mit dem Ingress-Praefix als BASEURL zeigen diese wieder in den Ingress-Pfad.
    fastcgi_param BBUDDY_BASEURL $http_x_ingress_path;
    # Home Assistant hat den Benutzer bereits authentifiziert
    fastcgi_param BBUDDY_DISABLE_AUTHENTICATION 'true';
  }
}
