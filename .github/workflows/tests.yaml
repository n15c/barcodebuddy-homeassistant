name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP-, JavaScript- und Browsertests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, sqlite3, pdo_sqlite, sockets, mbstring, gettext, redis, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Playwright mit Chromium installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Tests ausfuehren
        run: ./test/run.sh
