name: Images veroeffentlichen

# Baut bei jeder neuen Version (config.yaml) auf master fertige Images fuer alle Architekturen und
# veroeffentlicht sie in der GitHub Container Registry. Home Assistant laedt sie dann herunter,
# statt das Add-on auf dem Geraet zu bauen (config.yaml: image).
#
# Einmalig nach der ersten Veroeffentlichung: Die vier Pakete (ghcr.io/<owner>/<arch>-addon-bbuddy-grocy)
# unter GitHub -> Packages auf "Public" stellen, sonst kann Home Assistant sie nicht laden.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: i386
            platform: linux/386
    steps:
      - uses: actions/checkout@v4

      - name: Version und Image-Name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="$(yq '.version' config.yaml)"
          image="ghcr.io/${owner}/${{ matrix.arch }}-addon-bbuddy-grocy"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "from=$(yq '.build_from.${{ matrix.arch }}' build.yaml)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Schon veroeffentlicht?
        id: exists
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" > /dev/null 2>&1; then
            echo "Version ${{ steps.meta.outputs.version }} ist schon veroeffentlicht"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.exists.outputs.skip == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.skip == 'false'

      - name: Bauen und veroeffentlichen
        if: steps.exists.outputs.skip == 'false'
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --build-arg BUILD_FROM="${{ steps.meta.outputs.from }}" \
            --build-arg BUILD_ARCH="${{ matrix.arch }}" \
            --build-arg BUILD_VERSION="${{ steps.meta.outputs.version }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --push \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image }}:latest" .
