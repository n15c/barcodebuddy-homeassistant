---
configuration:
  disable_auth:
    name: Anmeldung deaktivieren
    description: >-
      Schaltet die BarcodeBuddy-Anmeldung auf dem direkten Port (8621) ab.
      Achtung: Dann hat jeder im Netzwerk ohne Anmeldung vollen Zugriff.
      Über Home Assistant (Ingress) ist ohnehin keine separate Anmeldung nötig.
  debug:
    name: Debug-Modus
    description: Zeigt PHP-Fehler und zusätzliche Debug-Ausgaben an.
  curl_allow_insecure_ssl_ca:
    name: Nicht vertrauenswürdige SSL-Zertifikate erlauben
    description: >-
      Grocy-Zertifikate akzeptieren, die nicht von einer vertrauenswürdigen
      Zertifizierungsstelle signiert sind (z.B. selbstsigniert).
  curl_allow_insecure_ssl_host:
    name: Abweichende SSL-Hostnamen erlauben
    description: >-
      Grocy-Zertifikate akzeptieren, deren Hostname nicht zur URL passt.
  ATTACH_BARCODESCANNER:
    name: Barcodescanner anbinden
    description: >-
      Liest Barcodes direkt von einem USB-Scanner oder einer Tastatur, die am
      Home-Assistant-Host angeschlossen ist.
  SCANNER_DEVICE:
    name: Scanner-Gerät
    description: >-
      Das zu verwendende Eingabegerät (Scanner oder Tastatur). Wird nur
      verwendet, wenn „Barcodescanner anbinden“ aktiv ist.
  SCANNER_DEBUG:
    name: Scanner-Diagnose
    description: >-
      Protokolliert beim Start 30 Sekunden lang die Tastendrücke des gewählten
      Scanner-Geräts. Währenddessen einen Barcode scannen, um zu prüfen, ob das
      richtige Gerät gewählt ist. Achtung: Bei einer Tastatur landen auch
      eingegebene Texte im Log, daher nur kurz zur Fehlersuche aktivieren.
  auto_create_products:
    name: Unbekannte Produkte automatisch anlegen
    description: >-
      Unbekannte Barcodes werden bei Open Food Facts nachgeschlagen und direkt als
      Produkt in Grocy angelegt – mit Name, Bild, Marke, Menge, Zutaten, Allergenen,
      Nährwerten und Energie. Danach wird der Scan normal verbucht (z.B. Einkauf).
      Wird nichts gefunden, landet der Barcode wie bisher in der Liste der unbekannten Barcodes.
  auto_create_location:
    name: Lagerort für neue Produkte
    description: >-
      Name eines Lagerorts in Grocy (z.B. „Vorratsschrank“). Leer lassen, um die
      Grocy-Voreinstellung für neue Produkte bzw. den ersten Lagerort zu verwenden.
      Kann pro Produkt später in Grocy geändert werden.
  auto_create_quantity_unit:
    name: Mengeneinheit für neue Produkte
    description: >-
      Name einer Mengeneinheit in Grocy (z.B. „Stück“ oder „Packung“). Leer lassen,
      um die Grocy-Voreinstellung für neue Produkte bzw. die erste Mengeneinheit zu
      verwenden. Kann pro Produkt später in Grocy geändert werden.
  product_language:
    name: Sprache der Produktdaten
    description: >-
      Zweistelliger Sprachcode (z.B. de, en, fr) für Produktnamen und Zutaten von
      Open Food Facts sowie für die Beschriftungen in der Produktbeschreibung.
network:
  80/tcp: Weboberfläche (direkter Zugriff, z.B. für die API und Scanner-Apps)
